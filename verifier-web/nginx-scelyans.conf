# A placer dans /etc/nginx/sites-available/scelyans.com (ou equivalent),
# puis activer avec un lien symbolique vers sites-enabled/.
# Suppose que le certificat HTTPS est deja en place (voir instructions certbot).
#
# La ligne limit_req_zone doit être dans le bloc http{} global de nginx
# (/etc/nginx/nginx.conf), pas ici : ajoutez-la une fois, a la main, si elle
# n'y est pas deja :
#   limit_req_zone $binary_remote_addr zone=scelyans_verif:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name scelyans.com www.scelyans.com;

    # Page d'accueil statique (site/index.html dans le depot)
    root /opt/scelyans-verifier/scelyans-archive/site;
    index index.html;

    location /verifier/ {
        limit_req zone=scelyans_verif burst=3 nodelay;
        proxy_pass http://127.0.0.1:8099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
